name: Build Miku Calc APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade "setuptools<60.0.0" "virtualenv<20.20.0" "cython<3.0.0" buildozer
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev

    - name: Auto-Accept Android Licenses
      run: |
        # Принудительно создаем структуру папок для Android SDK, чтобы запустить менеджер лицензий
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        # Запускаем короткую инициализацию, чтобы Buildozer скачал инструменты
        buildozer android debug || true
        # Принудительно принимаем абсолютно все лицензии Google Android SDK автоматическим вводом 'yes'
        if [ -d ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin ]; then
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MikuCalc-APK
        path: bin/*.apk
