name: Build Miku Calc APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Шаг 1: Автоматическая установка Java
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    # Шаг 2: Установка системных библиотек Linux
    - name: Install System Dependencies
      run: |
        pip install --upgrade "setuptools<60.0.0" "virtualenv<20.20.0" "cython<3.0.0" buildozer
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev

    # Шаг 3: Официальное автоматическое принятие всех лицензий Android SDK
    - name: Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # Сборщик сам скачает чистые инструменты, если запустить короткую команду
        buildozer android debug || true
        # Принудительно подписываем соглашение Google
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # Шаг 4: Чистая сборка APK
    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    # Шаг 5: Сохранение и выдача файла
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MikuCalc-APK
        path: bin/*.apk
