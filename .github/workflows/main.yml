name: Build Miku Calc APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        pip install --upgrade "setuptools<60.0.0" "virtualenv<20.20.0" "cython<3.0.0" buildozer
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev

    - name: Manual Aidl Download and Setup
      run: |
        # 1. Принудительно создаем структуру папок, которую так сильно требует Buildozer
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/
        
        # 2. Скачиваем чистый, рабочий бинарник aidl напрямую из репозиториев
        wget http://debian.org
        
        # 3. Распаковываем скачанный пакет во временную папку
        ar x aidl_10.0.0+r36-1_amd64.deb
        tar -xf data.tar.xz
        
        # 4. Переносим готовый файл aidl прямо под нос Buildozer
        cp usr/lib/android-sdk/build-tools/aidl ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/
        
        # 5. Даем файлу железные права на запуск в системе Linux
        chmod +x ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl
        
        # Проверяем, что файл действительно лежит на месте
        ls -la ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/
        echo "=== СКАЧАЛИ И ПОДСУНУЛИ АИДЛ ВРУЧНУЮ! ==="

    - name: Build APK with Buildozer
      env:
        # Системный флаг, отключающий любые другие требования лицензий
        ANDROID_NOT_UNATTENDED: "1"
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MikuCalc-APK
        path: bin/*.apk
