name: Build Miku Calc APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies (Fix Aidl)
      run: |
        # Обновляем pip и базовые инструменты
        pip install --upgrade "setuptools<60.0.0" "virtualenv<20.20.0" "cython<3.0.0" buildozer
        sudo apt-get update
        
        # Принудительно ставим системный aidl и библиотеки совместимости Linux
        sudo apt-get install -y libsqlite3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev aidl lib32stdc++6 lib32z1

    - name: Auto-Accept Android SDK Licenses
      run: |
        # Искусственно создаем пути, чтобы Android SDK Manager не ругался на отсутствие файлов
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Запускаем короткий старт, чтобы buildozer инициализировал скачивание менеджера Google
        buildozer android debug || true
        
        # Если менеджер скачался, принудительно подписываем все лицензии через автоматический ввод 'yes'
        if [ -d ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin ]; then
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi

    - name: Build APK with Buildozer
      env:
        # Системный флаг для отключения интерактивных запросов Android
        ANDROID_NOT_UNATTENDED: "1"
      run: |
        # Запуск финальной компиляции
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MikuCalc-APK
        path: bin/*.apk
