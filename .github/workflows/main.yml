name: Build Miku Calc APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies (Fix Aidl)
      run: |
        pip install --upgrade "setuptools<60.0.0" "virtualenv<20.20.0" "cython<3.0.0" buildozer
        sudo apt-get update
        # Жестко ставим системный aidl
        sudo apt-get install -y libsqlite3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev aidl lib32stdc++6 lib32z1

    - name: Auto-Accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        
        # Скачиваем SDK компоненты
        buildozer android debug || true
        
        if [ -d ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin ]; then
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # Принудительно заставляем скачать build-tools версии 33.0.0
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0" || true
        fi

    - name: Force Fix Aidl Path For Buildozer
      run: |
        # ЖЕСТКИЙ ФИКС: Создаем ту самую папку, которую требует Buildozer
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/
        # Копируем системный рабочий aidl прямо ему в эту папку
        cp /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/
        # Даем файлу полные права на запуск
        chmod +x ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl
        echo "=== Аидл успешно подсунут в папку Buildozer! ==="

    - name: Build APK with Buildozer
      env:
        ANDROID_NOT_UNATTENDED: "1"
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MikuCalc-APK
        path: bin/*.apk
