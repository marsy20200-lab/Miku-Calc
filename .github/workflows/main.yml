name: Build Miku Calc APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install --upgrade "setuptools<60.0.0" "virtualenv<20.20.0" "cython<3.0.0" buildozer
        sudo apt-get update
        # Устанавливаем системные компоненты и Android SDK Build-Tools, где лежит утилита aidl
        sudo apt-get install -y libsqlite3-dev openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev google-android-sdk-platform-tools-installer
        
    - name: Build APK with Buildozer
      env:
        # Автоматическое тихое согласие со всеми лицензиями Android SDK
        ANDROID_NOT_UNATTENDED: "1"
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MikuCalc-APK
        path: bin/*.apk
